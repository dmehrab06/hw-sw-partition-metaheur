graph-file: inputs/task_graph_topology/soda-benchmark-graphs/pytorch-graphs/squeeze_net_tosa.dot
area-constraint: 0.3
hw-scale-factor: 0.1
hw-scale-variance: 0.5
comm-scale-factor: 1.0
seed: 49
solver-tool: cvxpy
solution-dir: outputs/squeezenet_area_sweep/full/partitions
result-file-prefix: squeezenet_area_sweep_full
output-dir: outputs/squeezenet_area_sweep/full
taskgraph-dir: inputs/task_graph_complete
taskgraph-pickle: inputs/task_graph_complete/taskgraph-squeeze_net_tosa_area-0.30_hwscale-0.10_hwvar-0.50_comm-1.00_seed-49.pkl
opt-cost-type: makespan
mip:
  solve-mode: hybrid
  sw-constraint-mode: adjacent
  use-reduced-sw-constraints: true
  round-threshold: 0.5
  verbose: false
  preferred-solvers:
  - HIGHS
  - GUROBI
  - SCIP
  - GLPK_MI
  - CBC
  - ECOS_BB
  time-limit-sec: 30
  mip-gap: 0.15
  node-limit: 20000
  accept-nonoptimal: true
visualization:
  enabled: false
  include_input_graph: false
  include_output_schedule: false
  out_dir: outputs/squeezenet_area_sweep/full/visualizations
  input_dir: outputs/squeezenet_area_sweep/full/visualizations/input
  schedule_dir: outputs/squeezenet_area_sweep/full/visualizations/schedule
  strict_partitions: false
methods:
- random
- greedy
- diff_gnn
- gcps
- pso
- dbpso
- clpso
- ccpso
- esa
- shade
- jade
- gl25
